<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file:; style-src 'unsafe-inline'; script-src 'self' 'unsafe-inline'" />
  <title>Agro Rural</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 0 12px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0f3d2e;
      color: #f4f7f5;
      user-select: none;
      -webkit-app-region: drag;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand img { width: 22px; height: 22px; }
    .title { font-size: 13px; font-weight: 650; letter-spacing: .02em; }
    .hint { font-size: 11px; opacity: .7; margin-left: 8px; }
    .actions { display: flex; align-items: center; gap: 8px; -webkit-app-region: no-drag; }
    .led {
      width: 8px; height: 8px; border-radius: 50%;
      background: #ef4444; box-shadow: 0 0 0 3px rgba(239,68,68,.18);
    }
    .led.on { background: #22c55e; box-shadow: 0 0 0 3px rgba(34,197,94,.18); }
    button {
      border: 0;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      color: #fff;
    }
    button:disabled { opacity: .55; cursor: default; }
    #btn { background: #dc2626; }
    #btn.online { background: #059669; }
    #fs { background: transparent; color: #d1e7dd; border: 1px solid rgba(255,255,255,.18); }
  </style>
</head>
<body>
  <div class="brand">
    <img src="assets/edem-logo.png" alt="Edem" />
    <span class="title">Agro Rural</span>
    <span class="hint">F11 tela cheia</span>
  </div>
  <div class="actions">
    <span id="led" class="led" title="Emissor NF-e"></span>
    <button id="btn" type="button">Iniciar emissor</button>
    <button id="fs" type="button">F11</button>
  </div>
  <script>
    const led = document.getElementById('led');
    const btn = document.getElementById('btn');
    const fsBtn = document.getElementById('fs');
    const api = window.agroDesktop;
    let online = false;
    let busy = false;

    function paint() {
      led.classList.toggle('on', online);
      btn.classList.toggle('online', online);
      btn.textContent = busy
        ? (online ? 'Abrindo…' : 'Iniciando…')
        : (online ? 'Configurar emissor' : 'Iniciar emissor');
      btn.disabled = busy;
    }

    if (api && api.onEmissorStatus) {
      api.onEmissorStatus((v) => { online = !!v; paint(); });
    }

    btn.addEventListener('click', async () => {
      if (busy || !api) return;
      busy = true;
      paint();
      try {
        if (online) await api.openEmissor();
        else await api.startEmissor();
      } catch (e) {
        alert(e && e.message ? e.message : String(e));
      } finally {
        busy = false;
        paint();
      }
    });
    fsBtn.addEventListener('click', () => api && api.toggleFullscreen());
    paint();
  </script>
</body>
</html>
